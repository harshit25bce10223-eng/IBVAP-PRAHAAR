<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0B132B"/>
      <stop offset="50%" stopColor="#080B10"/>
      <stop offset="100%" stopColor="#0D1E2D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#F5A623"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#2FD5E0" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#3FCB8C" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>

  <!-- Compass / Crosshair Reticle -->
  <line x1="32" y1="5" x2="32" y2="11" stroke="#2FD5E0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="53" x2="32" y2="59" stroke="#2FD5E0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="11" y2="32" stroke="#2FD5E0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="53" y1="32" x2="59" y2="32" stroke="#2FD5E0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tactical Trident (त्रिशूल / प्रहार insignia) -->
  <!-- Center Spear -->
  <path d="M32 14 L35 24 L32 22 L29 24 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <line x1="32" y1="22" x2="32" y2="48" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Prong -->
  <path d="M22 20 Q20 30 32 34" fill="none" stroke="#2FD5E0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="22,17 25,23 19,23" fill="#2FD5E0"/>

  <!-- Right Prong -->
  <path d="M42 20 Q44 30 32 34" fill="none" stroke="#2FD5E0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="42,17 45,23 39,23" fill="#2FD5E0"/>

  <!-- Base Guard & Star -->
  <line x1="24" y1="44" x2="40" y2="44" stroke="#3FCB8C" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="#3FCB8C" filter="url(#glow)"/>
</svg>
